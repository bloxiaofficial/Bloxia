<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover — Bloxia</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e2231a'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>B</text></svg>" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page">
    <h1 class="page-title">Discover</h1>
    <p class="page-sub">Browse millions of experiences across every genre.</p>

    <div class="filters" id="filters"></div>
    <div class="grid" id="gameGrid"></div>
    <p id="empty" class="page-sub hidden" style="margin-top:30px">No games match your search.</p>
  </main>

  <footer class="footer" id="footer"></footer>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/chat.js"></script>
  <script>
    const { GAMES, gameCard } = window.Bloxia;
    const genres = ["All", ...Array.from(new Set(GAMES.map(g => g.genre)))];
    const params = new URLSearchParams(location.search);
    let query = (params.get("q") || "").toLowerCase();
    let activeGenre = "All";

    const filtersEl = document.getElementById("filters");
    genres.forEach(gn => {
      const b = document.createElement("button");
      b.className = "chip-btn" + (gn === "All" ? " active" : "");
      b.textContent = gn;
      b.onclick = () => { activeGenre = gn; [...filtersEl.children].forEach(c => c.classList.toggle("active", c === b)); render(); };
      filtersEl.appendChild(b);
    });

    function render() {
      let list = GAMES.filter(g =>
        (activeGenre === "All" || g.genre === activeGenre) &&
        (!query || g.title.toLowerCase().includes(query) || g.genre.toLowerCase().includes(query))
      );
      const grid = document.getElementById("gameGrid");
      grid.innerHTML = "";
      grid.append(...list.map(gameCard));
      document.getElementById("empty").classList.toggle("hidden", list.length > 0);
    }
    render();
  </script>
</body>
</html>
