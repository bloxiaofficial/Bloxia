[project]
name = "bloxia-backend"
version = "0.1.0"
description = "Bloxia backend: accounts, studio levels, chat, mock coin purchases"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyJWT>=2.8",
    "pydantic>=2.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
